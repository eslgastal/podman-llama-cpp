version = 1

; Shared CPU settings for every model discovered by the router.
[*]
threads = 6
cpu-mask = 0x555
cpu-strict = 1
prio = 2
prio-batch = 2

[Qwen3.6-35B-A3B]
hf-repo = byteshape/Qwen3.6-35B-A3B-MTP-GGUF
hf-file = Qwen3.6-35B-A3B-IQ4_XS-4.19bpw.gguf
alias = byteshape/Qwen3.6-35B-A3B-MTP-GGUF:IQ4_XS-4.19bpw
load-on-startup = true
dedup-cache-models = true
mmproj-auto = true

; Qwen3.6 (coding) sampling defaults; clients can override per request.
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Inference and context.
spec-type = draft-mtp
spec-draft-n-max = 3
parallel = 4
ctx-size = 131072
kv-unified = true
cache-type-k = f16
cache-type-v = f16
image-min-tokens = 1024

; GPU and memory tuning.
flash-attn = on
load-mode = mlock
ubatch-size = 2048
